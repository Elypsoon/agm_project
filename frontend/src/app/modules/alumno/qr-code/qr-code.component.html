<p-toast />

<div class="p-4">

  <!-- Ingresar sesión -->
  <div class="card mb-4" *ngIf="!sesionActiva()">
    <h2 class="text-xl font-bold mb-2">Mi Código QR de Asistencia</h2>
    <p class="text-gray-500 mb-4">Ingresa el ID de sesión que te proporcionó tu docente</p>
    <div class="flex gap-2">
      <input
        pInputText
        type="text"
        placeholder="ID de sesión (UUID)"
        [ngModel]="sesionId()"
        (ngModelChange)="sesionId.set($event)"
        class="flex-1"
      />
      <p-button label="Generar QR" icon="pi pi-qrcode" (onClick)="activarSesion()" />
    </div>
  </div>

  <!-- QR activo -->
  <div *ngIf="sesionActiva()">

    <!-- Header alumno -->
    <div class="card mb-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white font-bold text-lg">
          {{ avatarLabel() }}
        </div>
        <div>
          <div class="font-bold text-lg">{{ userName() }}</div>
          <div class="text-sm text-gray-500">Sesión activa</div>
        </div>
      </div>
    </div>

    <!-- QR Code -->
    <div class="card mb-4 text-center">
      <div *ngIf="cargando()" class="py-8">
        <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
        <p class="mt-2 text-gray-500">Generando QR...</p>
      </div>

      <div *ngIf="!cargando() && qrData()">
        <qrcode
          [qrdata]="qrData()"
          [width]="250"
          [errorCorrectionLevel]="'M'"
        />

        <!-- Countdown ring -->
        <div class="flex justify-center mt-3">
          <svg width="70" height="70" viewBox="0 0 70 70">
            <circle cx="35" cy="35" r="27" fill="none" stroke="#e5e7eb" stroke-width="6"/>
            <circle
              cx="35" cy="35" r="27"
              fill="none" stroke="#6366f1" stroke-width="6"
              stroke-dasharray="169.6"
              [attr.stroke-dashoffset]="dashOffset()"
              stroke-linecap="round"
              transform="rotate(-90 35 35)"
              style="transition: stroke-dashoffset 1s linear"
            />
            <text x="35" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#6366f1">
              {{ secondsLeft() }}
            </text>
          </svg>
        </div>
        <p class="text-sm text-gray-500 mt-1">El QR se renueva automáticamente</p>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex gap-2">
      <p-button
        label="Renovar QR"
        icon="pi pi-refresh"
        severity="secondary"
        (onClick)="refreshQr()"
        class="flex-1"
      />
      <p-button
        label="Salir"
        icon="pi pi-sign-out"
        severity="danger"
        (onClick)="desactivar()"
      />
    </div>

  </div>
</div>
