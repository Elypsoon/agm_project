<div class="auth-layout">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">
        <i class="pi pi-envelope"></i>
      </div>
      <h1>Recuperar Contraseña</h1>
      <p>Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
    </div>

    <div *ngIf="successMessage" class="success-banner mb-4">
      <i class="pi pi-check-circle"></i> {{ successMessage }}
      <div class="mt-4 text-center">
        <a routerLink="/auth/login" class="back-link">Volver al inicio de sesión</a>
      </div>
    </div>

    <form *ngIf="!successMessage" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <p-floatlabel>
        <input id="email" type="email" pInputText formControlName="email" class="w-full" autocomplete="email" />
        <label for="email">Correo Electrónico</label>
      </p-floatlabel>

      <small class="p-error block" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
        <span *ngIf="forgotForm.get('email')?.hasError('required')">El correo es requerido.</span>
        <span *ngIf="forgotForm.get('email')?.hasError('email')">Formato de correo inválido.</span>
      </small>

      <div class="form-actions mt-4">
        <p-button type="submit" [loading]="isLoading" label="Enviar Enlace" styleClass="w-full"></p-button>
      </div>

      <div class="text-center mt-4">
        <a routerLink="/auth/login" class="back-link">Cancelar y volver</a>
      </div>
    </form>
    
    <div *ngIf="errorMessage" class="error-banner mt-4">
      <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
    </div>
  </div>
</div>
