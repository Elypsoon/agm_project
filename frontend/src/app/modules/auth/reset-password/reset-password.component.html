<div class="auth-layout">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">
        <i class="pi pi-key"></i>
      </div>
      <h1>Crear Nueva Contraseña</h1>
      <p>Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
    </div>

    <div *ngIf="successMessage" class="success-banner mb-4">
      <i class="pi pi-check-circle"></i> {{ successMessage }}
      <div class="mt-4 text-center">
        <a routerLink="/auth/login" class="back-link">Iniciar Sesión</a>
      </div>
    </div>

    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <p-floatlabel class="block">
        <p-password id="new_password" formControlName="new_password" [toggleMask]="true" [feedback]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <label for="new_password">Nueva Contraseña</label>
      </p-floatlabel>
      <small class="p-error block" *ngIf="resetForm.get('new_password')?.invalid && resetForm.get('new_password')?.touched">
        <span *ngIf="resetForm.get('new_password')?.hasError('required')">La contraseña es requerida.</span>
        <span *ngIf="resetForm.get('new_password')?.hasError('minlength')">Mínimo 8 caracteres.</span>
      </small>

      <p-floatlabel class="mt-4 block">
        <p-password id="new_password_confirm" formControlName="new_password_confirm" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <label for="new_password_confirm">Confirmar Contraseña</label>
      </p-floatlabel>
      <small class="p-error block" *ngIf="resetForm.get('new_password_confirm')?.touched && resetForm.hasError('passwordMismatch')">
        Las contraseñas no coinciden.
      </small>

      <div class="form-actions mt-4">
        <p-button type="submit" [loading]="isLoading" [disabled]="!uid || !token" label="Restablecer Contraseña" styleClass="w-full"></p-button>
      </div>
      
      <div class="text-center mt-4">
        <a routerLink="/auth/login" class="back-link">Cancelar</a>
      </div>
    </form>
    
    <div *ngIf="errorMessage" class="error-banner mt-4">
      <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
    </div>
  </div>
</div>
