<div class="auth-layout">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">
        <i class="pi pi-lock"></i>
      </div>
      <h1>Cambio Obligatorio</h1>
      <p>Por seguridad, debes cambiar tu contraseña predeterminada para continuar.</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <p-floatlabel>
        <p-password id="old_password" formControlName="old_password" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <label for="old_password">Contraseña Actual</label>
      </p-floatlabel>
      <small class="p-error block" *ngIf="passwordForm.get('old_password')?.invalid && passwordForm.get('old_password')?.touched">
        <span *ngIf="passwordForm.get('old_password')?.hasError('required')">La contraseña actual es requerida.</span>
      </small>

      <p-floatlabel class="mt-4 block">
        <p-password id="new_password" formControlName="new_password" [toggleMask]="true" [feedback]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <label for="new_password">Nueva Contraseña</label>
      </p-floatlabel>
      <small class="p-error block" *ngIf="passwordForm.get('new_password')?.invalid && passwordForm.get('new_password')?.touched">
        <span *ngIf="passwordForm.get('new_password')?.hasError('required')">La nueva contraseña es requerida.</span>
        <span *ngIf="passwordForm.get('new_password')?.hasError('minlength')">Mínimo 8 caracteres.</span>
      </small>

      <p-floatlabel class="mt-4 block">
        <p-password id="new_password_confirm" formControlName="new_password_confirm" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <label for="new_password_confirm">Confirmar Contraseña</label>
      </p-floatlabel>
      <small class="p-error block" *ngIf="passwordForm.get('new_password_confirm')?.touched && passwordForm.hasError('passwordMismatch')">
        Las contraseñas no coinciden.
      </small>

      <div class="form-actions mt-4">
        <p-button type="submit" [loading]="isLoading" label="Actualizar Contraseña" styleClass="w-full"></p-button>
      </div>
    </form>
    
    <div *ngIf="errorMessage" class="error-banner mt-4">
      <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
    </div>
  </div>
</div>
