version: '3.9'

services:
  ms-asistencias:
    build: .
    container_name: ms-asistencias
    ports:
      - "3005:3005"
      - "50055:50055"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only}
      - DEBUG=${DEBUG:-True}
      - DB_NAME=agm_asistencias_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db-asistencias
      - DB_PORT=5432
      - REDIS_URL=redis://redis-asistencias:6379/0
      - QR_SECRET_KEY=${QR_SECRET_KEY}
      - QR_MAX_AGE_SECONDS=60
      - GRPC_PORT=50055
      - MS_AUTH_GRPC_HOST=${MS_AUTH_GRPC_HOST:-localhost}
      - MS_AUTH_GRPC_PORT=${MS_AUTH_GRPC_PORT:-50051}
    depends_on:
      db-asistencias:
        condition: service_healthy
      redis-asistencias:
        condition: service_healthy
    restart: unless-stopped

  db-asistencias:
    image: postgres:15-alpine
    container_name: db-asistencias
    environment:
      POSTGRES_DB: agm_asistencias_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata_asistencias:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-asistencias:
    image: redis:7-alpine
    container_name: redis-asistencias
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_asistencias: