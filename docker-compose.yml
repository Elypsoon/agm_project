# =============================================================================
# AGM – Academic Grade Management
# Docker Compose: Orquestación de todos los microservicios y bases de datos
# =============================================================================

services:
  # Base de Datos independiente para el MS-1
  db-auth:
    image: postgres:15
    container_name: db-auth
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rojas2004
      POSTGRES_DB: agm_auth_db
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d agm_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db_auth_data:/var/lib/postgresql/data

  # Microservicio de Autenticación (MS-1) - AHORA CON DJANGO
  ms-auth:
    build: 
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    restart: on-failure
    ports:
      - "3001:3001"   # API REST
      - "50051:50051" # gRPC
    # --- ESTA ES LA PARTE CLAVE QUE FALTABA ---
    volumes:
      - ./ms-auth:/app
    # ------------------------------------------
    env_file:
      - ./ms-auth/.env
    depends_on:
      db-auth:
        condition: service_healthy

# Volumen persistente para los datos de PostgreSQL
volumes:
  db_auth_data: