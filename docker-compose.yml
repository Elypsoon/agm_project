# =============================================================================
# AGM – Academic Grade Management
# Docker Compose: Orquestación de todos los microservicios y bases de datos
# =============================================================================

services:
  # Base de Datos independiente para el MS-1
  db-auth:
    image: postgres:15
    container_name: db-auth
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rojas2004
      POSTGRES_DB: agm_auth_db
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d agm_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db_auth_data:/var/lib/postgresql/data

  # Microservicio de Autenticación (MS-1) - Django + gRPC
  ms-auth:
    build: 
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    restart: on-failure
    ports:
      - "3001:3001"   # API REST
      - "50051:50051" # gRPC
    volumes:
      - ./ms-auth:/app
    env_file:
      - ./ms-auth/.env
    depends_on:
      db-auth:
        condition: service_healthy
    # --- COMANDO PARA CORRER AMBOS SERVIDORES ---
    command: >
      sh -c "python manage.py runserver 0.0.0.0:3001 & 
             python grpc_server.py"

  # ---------------------------------------------------------------------------
  # MS-3: Docentes & Alumnos (Django + PostgreSQL)
  # ---------------------------------------------------------------------------

  # Base de datos independiente para MS-3
  db-alumnos:
    image: postgres:15
    container_name: db-alumnos
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alumnos_dev_2026
      POSTGRES_DB: agm_alumnos_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agm_alumnos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"   # Puerto 5433 en host para no colisionar con db-auth
    volumes:
      - db_alumnos_data:/var/lib/postgresql/data

  # Microservicio de Docentes & Alumnos (MS-3)
  ms-alumnos:
    build:
      context: ./ms-alumnos
      dockerfile: Dockerfile
    container_name: ms-alumnos
    restart: on-failure
    ports:
      - "3003:3003"   # API REST
      - "50053:50053" # gRPC
    volumes:
      - ./ms-alumnos:/app    # Hot-reload en desarrollo
    env_file:
      - ./ms-alumnos/.env
    depends_on:
      db-alumnos:
        condition: service_healthy


# ---------------------------------------------------------------------------
  # MS-5: Asistencias QR (Django + PostgreSQL + Redis)
  # ---------------------------------------------------------------------------

  # Base de datos independiente para MS-5
  db-asistencias:
    image: postgres:15
    container_name: db-asistencias
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asistencias_dev_2026
      POSTGRES_DB: agm_asistencias_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agm_asistencias_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    volumes:
      - db_asistencias_data:/var/lib/postgresql/data

  # Redis para sesiones activas del MS-5
  redis-asistencias:
    image: redis:7-alpine
    container_name: redis-asistencias
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Microservicio de Asistencias QR (MS-5)
  ms-asistencias:
    build:
      context: .
      dockerfile: ms-asistencias/Dockerfile
    container_name: ms-asistencias
    restart: on-failure
    ports:
      - "3005:3005"   # API REST
      - "50055:50055" # gRPC
    env_file:
      - ./ms-asistencias/.env
    depends_on:
      db-asistencias:
        condition: service_healthy
      redis-asistencias:
        condition: service_healthy


  # ---------------------------------------------------------------------------
  # MS-6: Notificaciones (Django + PostgreSQL)
  # ---------------------------------------------------------------------------

  # Base de datos independiente para MS-6
  db-notificaciones:
    image: postgres:15
    container_name: db-notificaciones
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: notificaciones_dev_2026
      POSTGRES_DB: agm_notificaciones_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agm_notificaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"   # Puerto 5436 en host para no colisionar con otras DBs
    volumes:
      - db_notificaciones_data:/var/lib/postgresql/data
  
  # Microservicio de Notificaciones (MS-6)
  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    restart: on-failure
    ports:
      - "3006:3006"   # API REST
      - "50056:50056" # gRPC
    volumes:
      - ./ms-notificaciones:/app    # Hot-reload en desarrollo
    env_file:
      - ./ms-notificaciones/.env
    depends_on:
      db-notificaciones:
        condition: service_healthy

# Volúmenes persistentes
volumes:
  db_auth_data:
  db_alumnos_data:
  db_asistencias_data:
  db_notificaciones_data: