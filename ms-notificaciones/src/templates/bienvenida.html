    <div style="max-width: 600px; background: white; border: 1px solid #004b93; padding: 20px; margin: 0 auto; border-radius: 5px;">
        <h2 style="color: #004b93; border-bottom: 2px solid #004b93; padding-bottom: 10px;">¡Bienvenido al Sistema AGM!</h2>

        <p>Has sido inscrito exitosamente en la materia con ID/NRC: <strong>{{ materia_id }}</strong>[cite: 187].</p>
        <p>Tu clave única de acceso al sistema es la siguiente:</p>
        <div style="background: #f4f4f4; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #333; margin: 20px 0;">
            {{ clave_acceso }}
        </div>
        <p style="color: #666; font-size: 12px;">Por razones de seguridad, te recomendamos no compartir esta clave con nadie más[cite: 144].</p>
    </div>
