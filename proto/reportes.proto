// =============================================================================
// MS-7: Reportes & Estadísticas — Definición del servicio gRPC
// =============================================================================

syntax = "proto3";
package reportes;

// ---------------------------------------------------------------------------
// Servicio gRPC expuesto por MS-7 para consumo de otros microservicios
// ---------------------------------------------------------------------------
service ReportesService {
  // Obtiene el último snapshot de estadísticas generado para una materia
  rpc GetEstadisticasMateria (GetEstadisticasRequest) returns (EstadisticasSnapshotResponse);
}

// ---------------------------------------------------------------------------
// Mensajes
// ---------------------------------------------------------------------------

message GetEstadisticasRequest {
  string materia_id = 1;
}

message EstadisticasSnapshotResponse {
  string snapshot_id = 1;
  string materia_id = 2;
  string periodo_id = 3;
  int32 total_alumnos = 4;
  float promedio_grupo = 5;
  float tasa_aprobacion = 6;
  float tasa_asistencia = 7;
  string fecha_generacion = 8;
}