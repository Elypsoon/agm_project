syntax = "proto3";

package periodos;

service PeriodosService {
  // MS-2 Periodos & Materias logic
  rpc GetMateriaById (MateriaIdRequest) returns (MateriaInfo);
  rpc GetMateriasByDocente (DocenteIdRequest) returns (MateriasListResponse);
  rpc GetPeriodoActivo (Empty) returns (PeriodoInfo);
}

// --- Requests ---

message MateriaIdRequest {
  string materia_id = 1;
}

message DocenteIdRequest {
  string docente_id = 1;
}

message Empty {}

// --- Responses ---

message HorarioInfo {
  string id = 1;
  string dia = 2;         // L, M, I, J, V, S, D
  string hora_inicio = 3; // e.g., "0800"
  string hora_fin = 4;    // e.g., "1059"
  string salon = 5;       // e.g., "12EMA4/208" or "POR ASIGNAR"
  bool es_virtual = 6;
  string profesor = 7;    // Docente name
}

message MateriaInfo {
  string id = 1;
  string nrc = 2;         // 5-digit anchor
  string clave = 3;       // e.g., "FCCA 004"
  string nombre = 4;      // e.g., "Introduccion a las Matematicas"
  string seccion = 5;     // e.g., "001"
  string docente_id = 6;
  string docente_nombre = 7;
  string periodo_id = 8;
  string estado = 9;      // "abierta", "cerrada", "finalizada"
  string campus = 10;   
  string plan_estudios = 11;
  repeated HorarioInfo horarios = 12; // Nested list of slots
}

message MateriasListResponse {
  repeated MateriaInfo materias = 1;
}

message PeriodoInfo {
  string id = 1;
  string nombre = 2;      // e.g., "Primavera 2026"
  string fecha_inicio = 3;
  string fecha_fin = 4;
  string estado = 5; 
}